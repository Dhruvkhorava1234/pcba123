# Railway / Nixpacks configuration for Laravel
[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
  'composer install --no-dev --optimize-autoloader',
  'npm ci',
  'npm run build'
]

[start]
cmd = 'php artisan migrate --force && php artisan storage:link || true && php -S 0.0.0.0:$PORT -t public'
